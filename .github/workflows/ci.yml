# The integration's tests on Home Assistant's own test harness, and a syntax check of the bundled card.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Tests
        run: python -m pytest -q tests -p no:logging
      - name: Card syntax
        run: find custom_components -name '*.js' -print0 | xargs -0 -r -n1 node --check

  card:
    # the bundled card in Chromium on a fake hass (tests_card/card_hass.json, written by the integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -r requirements_card.txt
          python -m playwright install --with-deps chromium
      - name: Card syntax
        run: node --check custom_components/render_monitor/www/render-monitor-card.js
      - name: Card in a browser
        run: python -m pytest -q tests_card -p no:cacheprovider
